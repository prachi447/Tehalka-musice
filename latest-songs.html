<!-- ================================= -->
<!-- AUTOMATIC SONG DISPLAY SYSTEM -->
<!-- ================================= -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function() {


    const container =
      document.getElementById(
        "songsContainer"
      );


    // Check songs database

    if (
      typeof songsData === "undefined"
    ) {

      container.innerHTML =

        "<p style='text-align:center;'>" +

        "❌ Songs database could not be loaded." +

        "</p>";

      return;

    }


    // Check empty database

    if (
      songsData.length === 0
    ) {

      container.innerHTML =

        "<p style='text-align:center;'>" +

        "🎵 No songs available yet." +

        "</p>";

      return;

    }


    // Create song cards

    songsData.forEach(
      function(song) {


        const songCard =
          document.createElement(
            "div"
          );


        songCard.className =
          "song-card";


        songCard.innerHTML = `

          <img
            src="${song.image}"
            alt="${song.name} song cover by ${song.artist}"
          >


          <h2>
            ${song.name}
          </h2>


          <p>
            🎤 Artist:
            <strong>
              ${song.artist}
            </strong>
          </p>


          <p>
            Listen to
            <strong>
              ${song.name}
            </strong>
            by
            <strong>
              ${song.artist}
            </strong>
            on Tehalka Music.
          </p>


          <audio controls>

            <source
              src="${song.mp3}"
              type="audio/mpeg"
            >

            Your browser does not support
            the audio player.

          </audio>


          <br><br>


          <a
            href="${song.page}"
          >

            <button>
              🎵 View Song Details
            </button>

          </a>


          <br><br>


          <a
            href="${song.mp3}"
            download
          >

            <button>
              ⬇ Download Song
            </button>

          </a>

        `;


        container.appendChild(
          songCard
        );


      }
    );


  }
);

</script>
