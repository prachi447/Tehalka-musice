<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Latest Songs - Tehalka Music | Listen & Download
  </title>

  <meta
    name="description"
    content="Listen to the latest songs on Tehalka Music. Discover, play and download your favourite songs."
  >

  <meta
    name="author"
    content="Tehalka Music"
  >

  <meta
    name="robots"
    content="index, follow"
  >

  <link
    rel="canonical"
    href="https://tehalkamusic.website/latest-songs.html"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


<!-- HEADER -->

<header>

  <h1>
    🎵 Tehalka Music
  </h1>

  <p>
    Listen • Discover • Download
  </p>

</header>


<!-- NAVIGATION -->

<nav>

  <a href="index.html">
    Home
  </a>

  <a href="latest-songs.html">
    Latest Songs
  </a>

  <a href="albums.html">
    Albums
  </a>

  <a href="about.html">
    About
  </a>

  <a href="contact.html">
    Contact
  </a>

  <a href="privacy-policy.html">
    Privacy Policy
  </a>

  <a href="terms.html">
    Terms & Conditions
  </a>

  <a href="copyright.html">
    Copyright Policy
  </a>

</nav>


<!-- HERO -->

<section class="hero">

  <h2>
    🎵 Latest Songs
  </h2>

  <p>
    Listen to the latest music on Tehalka Music.
  </p>

</section>


<!-- SONGS -->

<div
  class="container"
  id="songsContainer"
>

  <h2
    style="text-align:center; margin-bottom:30px;"
  >
    🎵 All Latest Songs
  </h2>

</div>


<!-- FOOTER -->

<footer>

  <p>
    © 2026 Tehalka Music |
    All Rights Reserved
  </p>

</footer>


<!-- SONG DATABASE -->

<script src="songs.js"></script>


<!-- DYNAMIC SONG SYSTEM -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const container =
      document.getElementById(
        "songsContainer"
      );


    if (
      typeof songsData === "undefined"
    ) {

      container.innerHTML +=
        "<p style='text-align:center;'>Songs could not be loaded.</p>";

      return;

    }


    songsData.forEach(
      function(song) {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "song-card";


        card.innerHTML = `

          <img
            src="${song.image}"
            alt="${song.name} song cover by ${song.artist}"
          >

          <h2>
            ${song.name}
          </h2>

          <p>
            🎤 Artist:
            <strong>
              ${song.artist}
            </strong>
          </p>

          <p>
            Listen to
            ${song.name}
            by
            ${song.artist}
            on Tehalka Music.
          </p>

          <audio controls>

            <source
              src="${song.mp3}"
              type="audio/mpeg"
            >

            Your browser does not support
            the audio player.

          </audio>

          <br><br>

          <a
            href="${song.page}"
          >

            <button>
              🎵 View Song Details
            </button>

          </a>

          <br><br>

          <a
            href="${song.mp3}"
            download
          >

            <button>
              ⬇ Download Song
            </button>

          </a>

        `;


        container.appendChild(
          card
        );

      }
    );

  }
);

</script>


</body>

</html>
