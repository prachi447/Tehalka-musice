<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Advanced Song Manager - Tehalka Music
  </title>

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fb;
      color: #111827;
    }

    header {
      background: linear-gradient(
        135deg,
        #111827,
        #312e81
      );
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      width: 94%;
      max-width: 950px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .card h2 {
      margin-top: 0;
      color: #111827;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .required {
      color: red;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
      box-shadow:
        0 0 0 3px
        rgba(79, 70, 229, 0.12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #111827;
      color: white;
      flex: 1;
    }

    .clear {
      background: #e5e7eb;
      color: #111827;
      flex: 1;
    }

    .copy {
      background: #2563eb;
      color: white;
      width: 100%;
      margin-top: 12px;
    }

    .success {
      display: none;
      background: #dcfce7;
      color: #166534;
      padding: 14px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 10px;
      margin-top: 20px;
      font-weight: bold;
    }

    .output {
      display: none;
    }

    .output h3 {
      margin-top: 25px;
      color: #312e81;
    }

    .code-box {
      width: 100%;
      min-height: 250px;
      background: #111827;
      color: #f9fafb;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    .preview {
      display: none;
      text-align: center;
      padding: 25px;
      background: #f9fafb;
      border-radius: 15px;
      margin-top: 20px;
    }

    .preview img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 15px;
      display: block;
      margin: 0 auto 15px;
    }

    .preview audio {
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
    }

    .instructions {
      background: #fff7ed;
      border-left: 5px solid #f97316;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.7;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 24px;
      }

      .card {
        padding: 18px;
      }

      .button-row {
        flex-direction: column;
      }

      .generate,
      .clear {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>
    🎵 Tehalka Music
  </h1>

  <p>
    Advanced Song Manager
  </p>

</header>


<main class="container">


  <!-- ================================= -->
  <!-- SONG INFORMATION -->
  <!-- ================================= -->

  <div class="card">

    <h2>
      🎵 Create New Song
    </h2>

    <p>
      एक बार जानकारी भरें और
      songs.js code,
      Song Page code,
      Sitemap code और
      Robots.txt code तैयार करें।
    </p>


    <!-- SONG NAME -->

    <div class="form-group">

      <label>
        🎵 Song Name
        <span class="required">*</span>
      </label>

      <input
        id="songName"
        type="text"
        placeholder="Example: Ghadi"
      >

    </div>


    <!-- ARTIST -->

    <div class="form-group">

      <label>
        🎤 Artist / Singer
        <span class="required">*</span>
      </label>

      <input
        id="songArtist"
        type="text"
        placeholder="Example: Mitta Bahu Ala"
      >

    </div>


    <!-- ALBUM -->

    <div class="form-group">

      <label>
        💿 Album Name
      </label>

      <input
        id="songAlbum"
        type="text"
        placeholder="Example: Singles"
      >

    </div>


    <!-- CATEGORY -->

    <div class="form-group">

      <label>
        🎼 Category
      </label>

      <input
        id="songCategory"
        type="text"
        placeholder="Example: Haryanvi"
      >

    </div>


    <!-- IMAGE -->

    <div class="form-group">

      <label>
        🖼️ Cover Image File Name
        <span class="required">*</span>
      </label>

      <input
        id="songImage"
        type="text"
        placeholder="Example: sddefault.jpg"
      >

    </div>


    <!-- MP3 -->

    <div class="form-group">

      <label>
        🎧 MP3 File Name
        <span class="required">*</span>
      </label>

      <input
        id="songMp3"
        type="text"
        placeholder="Example: Ghadi.mp3"
      >

    </div>


    <!-- SONG PAGE -->

    <div class="form-group">

      <label>
        🔗 Song Page File Name
      </label>

      <input
        id="songPage"
        type="text"
        placeholder="Example: ghadi.html"
      >

    </div>


    <!-- DESCRIPTION -->

    <div class="form-group">

      <label>
        📝 Song Description
      </label>

      <textarea
        id="songDescription"
        placeholder="Write a short description..."
      ></textarea>

    </div>


    <!-- SEO KEYWORDS -->
