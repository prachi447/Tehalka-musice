<!-- ================================ -->
<!-- ARTIST SYSTEM -->
<!-- ================================ -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function() {


    const container =
      document.getElementById(
        "artistsContainer"
      );


    // =====================================
    // CHECK SONG DATABASE
    // =====================================

    if (
      typeof songsData === "undefined"
    ) {

      container.innerHTML =

        "<p style='text-align:center; color:red;'>" +

        "❌ Songs database could not be loaded." +

        "</p>";

      return;

    }


    // =====================================
    // CHECK SONGS
    // =====================================

    if (
      songsData.length === 0
    ) {

      container.innerHTML =

        "<p style='text-align:center;'>" +

        "🎵 No artists available yet." +

        "</p>";

      return;

    }


    // =====================================
    // CREATE ARTIST LIST
    // =====================================

    const artists = [];


    songsData.forEach(
      function(song) {


        const artist =
          song.artist.trim();


        // Avoid duplicate artists

        if (
          !artists.includes(
            artist
          )
        ) {

          artists.push(
            artist
          );

        }

      }
    );


    // =====================================
    // DISPLAY ARTISTS
    // =====================================

    artists.forEach(
      function(artist) {


        // Find artist's first song

        const firstSong =
          songsData.find(
            function(song) {

              return (
                song.artist.trim()
                ===
                artist
              );

            }
          );


        const artistCard =
          document.createElement(
            "div"
          );


        artistCard.className =
          "song-card";


        artistCard.innerHTML = `

          <h2>
            🎤 ${artist}
          </h2>


          <p>
            Explore songs by
            <strong>
              ${artist}
            </strong>
            on Tehalka Music.
          </p>


          <a
            href="${firstSong.page}"
          >

            <button>
              🎵 View Songs
            </button>

          </a>

        `;


        container.appendChild(
          artistCard
        );


      }
    );


  }
);

</script>
