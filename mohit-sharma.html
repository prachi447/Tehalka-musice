<!-- ARTIST SONG SYSTEM -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function() {


    const container =
      document.getElementById(
        "artistSongsContainer"
      );


    // Check database

    if (
      typeof songsData === "undefined"
    ) {

      container.innerHTML =

        "<p style='text-align:center; color:red;'>" +

        "❌ Songs database could not be loaded." +

        "</p>";

      return;

    }


    // Artist name

    const artistName =
      "Mohit Sharma";


    // Find artist songs

    const artistSongs =
      songsData.filter(
        function(song) {

          return (

            song.artist
              .toLowerCase()
              .includes(
                artistName.toLowerCase()
              )

          );

        }
      );


    // No songs

    if (
      artistSongs.length === 0
    ) {

      container.innerHTML =

        "<p style='text-align:center;'>" +

        "🎵 No songs found for this artist." +

        "</p>";

      return;

    }


    // Show songs

    artistSongs.forEach(
      function(song) {


        const songCard =
          document.createElement(
            "div"
          );


        songCard.className =
          "song-card";


        songCard.innerHTML = `

          <img
            src="${song.image}"
            alt="${song.name} by ${song.artist}"
          >


          <h2>
            ${song.name}
          </h2>


          <p>
            🎤 Artist:
            <strong>
              ${song.artist}
            </strong>
          </p>


          <audio
            controls
            preload="metadata"
          >

            <source
              src="${song.mp3}"
              type="audio/mpeg"
            >

            Your browser does not support
            the audio player.

          </audio>


          <br><br>


          <a
            href="${song.page}"
          >

            <button>
              🎵 View Song Details
            </button>

          </a>


          <br><br>


          <a
            href="${song.mp3}"
            download
          >

            <button>
              ⬇ Download Song
            </button>

          </a>

        `;


        container.appendChild(
          songCard
        );


      }
    );


  }
);

</script>
